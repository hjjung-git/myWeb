<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="portfolio">

    <!-- 비로그인 -->
    <div th:if="${notLoggedIn}" style="text-align:center; padding:48px 0; color:var(--text-tertiary); font-size:13px;">
        <i class="bi bi-person-lock" style="font-size:28px; display:block; margin-bottom:10px;"></i>
        관리자 모드가 필요한 기능입니다.
        <a href="#" onclick="openSettings(); return false;" class="btn btn-sm btn-accent d-block mt-3 mx-auto" style="width:fit-content;">관리자 모드로 전환</a>
    </div>

    <th:block th:unless="${notLoggedIn}">

        <!-- 요약 카드 -->
        <div th:if="${totalEval != null}" class="portfolio-summary">
            <div class="portfolio-summary-row">
                <span style="color:var(--text-tertiary); font-size:11px;">총 평가금액</span>
                <span style="font-size:16px; font-weight:600; color:var(--text-primary);"
                      th:text="${#numbers.formatInteger(totalEval, 0, 'COMMA')} + '원'"></span>
            </div>
            <div class="portfolio-summary-row">
                <span style="color:var(--text-tertiary); font-size:11px;">총 투자금액</span>
                <span style="font-size:13px; color:var(--text-secondary);"
                      th:text="${#numbers.formatInteger(totalInvest, 0, 'COMMA')} + '원'"></span>
            </div>
            <div class="portfolio-summary-row">
                <span style="color:var(--text-tertiary); font-size:11px;">평가손익</span>
                <span style="font-size:13px; font-weight:500;"
                      th:style="${totalProfit.signum() >= 0} ? 'color:var(--accent-teal)' : 'color:var(--accent-red)'"
                      th:text="(${totalProfit.signum() >= 0} ? '+' : '') + ${#numbers.formatInteger(totalProfit, 0, 'COMMA')} + '원 (' + (${totalProfitRate.signum() >= 0} ? '+' : '') + ${totalProfitRate} + '%)'"></span>
            </div>
        </div>

        <!-- 보유 코인 목록 -->
        <div th:if="${#lists.isEmpty(holdings)}"
             style="text-align:center; padding:32px 0; color:var(--text-tertiary); font-size:13px;">
            보유 코인을 추가해보세요.
        </div>

        <div th:each="row : ${rows}" class="holding-row">
            <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;">
                <span class="holding-coin" th:text="${row.holding.coin}">BTC</span>
                <button class="holding-delete-btn"
                        th:attr="onclick='deleteHolding(' + ${row.holding.id} + ')'">
                    <i class="bi bi-trash3"></i>
                </button>
            </div>
            <div class="holding-stats">
                <div class="holding-stat">
                    <div class="label">평균가</div>
                    <div class="value" th:text="${#numbers.formatInteger(row.holding.avgPrice, 0, 'COMMA')}"></div>
                </div>
                <div class="holding-stat">
                    <div class="label">수량</div>
                    <div class="value" th:text="${row.holding.quantity}"></div>
                </div>
                <div class="holding-stat">
                    <div class="label">현재가</div>
                    <div class="value" th:text="${#numbers.formatInteger(row.currentPrice, 0, 'COMMA')}"></div>
                </div>
                <div class="holding-stat">
                    <div class="label">평가금액</div>
                    <div class="value" th:text="${#numbers.formatInteger(row.eval, 0, 'COMMA')}"></div>
                </div>
                <div class="holding-stat">
                    <div class="label">손익</div>
                    <div class="value"
                         th:style="${row.profitRate.signum() >= 0} ? 'color:var(--accent-teal)' : 'color:var(--accent-red)'"
                         th:text="(${row.profitRate.signum() >= 0} ? '+' : '') + ${row.profitRate} + '%'"></div>
                </div>
            </div>
        </div>

        <!-- 추가 폼 -->
        <div class="holding-add-form">
            <div class="section-label" style="margin-bottom:10px;">코인 추가 / 수정</div>
            <div class="d-flex gap-2 flex-wrap">
                <input type="text" id="pf-coin" class="form-control form-control-sm dark-input"
                       placeholder="BTC" style="width:70px;" maxlength="10">
                <input type="number" id="pf-avg" class="form-control form-control-sm dark-input"
                       placeholder="평균매수가" step="any" style="flex:1; min-width:100px;">
                <input type="number" id="pf-qty" class="form-control form-control-sm dark-input"
                       placeholder="수량" step="any" style="width:90px;">
                <button class="btn btn-sm btn-accent" onclick="submitHolding()">추가</button>
            </div>
            <div id="pf-error" style="color:var(--accent-red); font-size:11px; margin-top:6px; display:none;"></div>
        </div>

    </th:block>

    <script th:inline="none">
        function submitHolding() {
            var coin = document.getElementById('pf-coin').value.trim();
            var avg  = document.getElementById('pf-avg').value;
            var qty  = document.getElementById('pf-qty').value;
            var err  = document.getElementById('pf-error');

            if (!coin || !avg || !qty) {
                err.textContent = '모든 항목을 입력해주세요.';
                err.style.display = 'block';
                return;
            }
            err.style.display = 'none';

            var body = new URLSearchParams({ coin: coin, avgPrice: avg, quantity: qty });
            fetch('/portfolio/holding', { method: 'POST', body: body })
                .then(r => {
                    if (r.ok) {
                        document.getElementById('pf-coin').value = '';
                        document.getElementById('pf-avg').value  = '';
                        document.getElementById('pf-qty').value  = '';
                        loadPortfolio();
                    } else {
                        err.textContent = '저장 중 오류가 발생했습니다.';
                        err.style.display = 'block';
                    }
                });
        }

        function deleteHolding(id) {
            if (!confirm('삭제하시겠습니까?')) return;
            fetch('/portfolio/holding/' + id + '/delete', { method: 'POST' })
                .then(r => { if (r.ok) loadPortfolio(); });
        }
    </script>
</div>
</body>
</html>
