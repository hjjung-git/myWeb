<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<th:block th:fragment="sidebar(activeMenu)">

<div class="app-sidebar">
    <a href="/main/list" class="logo">M</a>

    <a href="/main/list"
       class="nav-icon"
       th:classappend="${activeMenu == 'dashboard'} ? ' active' : ''"
       title="대시보드">
        <i class="bi bi-speedometer2"></i>
    </a>

    <a href="#"
       class="nav-icon"
       th:classappend="${activeMenu == 'news'} ? ' active' : ''"
       title="뉴스"
       onclick="openNewsPanel(); return false;">
        <i class="bi bi-newspaper"></i>
    </a>

    <a href="#"
       class="nav-icon"
       th:classappend="${activeMenu == 'portfolio'} ? ' active' : ''"
       title="포트폴리오"
       onclick="openPortfolioPanel(); return false;">
        <i class="bi bi-pie-chart"></i>
    </a>

    <a href="#"
       class="nav-icon"
       th:classappend="${activeMenu == 'insight'} ? ' active' : ''"
       title="인사이트"
       onclick="openPanel('INSIGHT'); return false;">
        <i class="bi bi-lightbulb"></i>
    </a>

    <a href="#"
       class="nav-icon"
       th:classappend="${activeMenu == 'tradelog'} ? ' active' : ''"
       title="매매일지"
       onclick="openPanel('TRADE_LOG'); return false;">
        <i class="bi bi-graph-up-arrow"></i>
    </a>

    <div class="nav-spacer"></div>

    <a href="#" class="nav-icon" title="설정" onclick="openSettings(); return false;">
        <i class="bi bi-gear"></i>
    </a>
</div>

<!-- 설정 오버레이 -->
<div id="settings-overlay" class="settings-overlay" onclick="closeSettingsOnBackdrop(event)">
    <div class="settings-modal">
        <div class="settings-header">
            <span class="settings-title">설정</span>
            <button class="settings-close-btn" onclick="closeSettings()">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>

        <div sec:authorize="isAuthenticated()" class="settings-section">
            <div class="settings-section-label">계정</div>
            <div class="settings-user-info">
                <div class="settings-avatar">
                    <i class="bi bi-person-fill"></i>
                </div>
                <div>
                    <div style="font-size: 14px; font-weight: 500; color: var(--text-primary);"
                         sec:authentication="name">사용자</div>
                    <div style="font-size: 11px; color: var(--text-tertiary);">로그인됨</div>
                </div>
            </div>
            <form th:action="@{/user/logout}" method="post" style="margin-top: 10px;">
                <button type="submit" class="settings-menu-item" style="width:100%; text-align:left;">
                    <i class="bi bi-person"></i> 사용자 모드로 전환
                </button>
            </form>
        </div>

        <div sec:authorize="isAnonymous()" class="settings-section">
            <div class="settings-section-label">계정</div>
            <div style="display:flex; gap:6px; padding: 0 4px;">
                <input type="password" id="admin-code-input" placeholder="코드 입력"
                       style="flex:1; background: var(--bg-surface); border: 1px solid var(--border-default);
                              color: var(--text-primary); border-radius: 6px; padding: 6px 10px; font-size: 13px;"
                       onkeydown="if(event.key==='Enter') adminCodeLogin();">
                <button onclick="adminCodeLogin()" class="settings-menu-item"
                        style="width:auto; padding: 6px 12px;">입장</button>
            </div>
            <div id="admin-code-error" style="color:var(--accent-red); font-size:12px; padding: 4px 4px 0;"></div>
        </div>

        <div sec:authorize="isAuthenticated()" class="settings-section">
            <div class="settings-section-label">바로가기</div>
            <a href="/post/write/form" class="settings-menu-item" onclick="closeSettings()">
                <i class="bi bi-plus-circle"></i> 새 글 작성
            </a>
        </div>

        <div class="settings-section">
            <div class="settings-section-label">정보</div>
            <div class="settings-info-row">
                <span>프로젝트</span><span>myWeb</span>
            </div>
            <div class="settings-info-row">
                <span>테마</span><span>다크</span>
            </div>
        </div>
    </div>
</div>

<script th:inline="none">
    function openSettings() {
        document.getElementById('settings-overlay').classList.add('active');
    }
    function closeSettings() {
        document.getElementById('settings-overlay').classList.remove('active');
    }
    function closeSettingsOnBackdrop(e) {
        if (e.target === document.getElementById('settings-overlay')) closeSettings();
    }
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeSettings();
    });

    // 관리자 코드 입력 -> /api/auth/admin으로 로그인 처리 (기존 Spring Security 세션 재사용)
    async function adminCodeLogin() {
        const input = document.getElementById('admin-code-input');
        const errorEl = document.getElementById('admin-code-error');
        const code = input.value;
        errorEl.textContent = '';

        if (!code) return;

        try {
            const csrfRes = await fetch('/api/auth/csrf');
            const csrf = await csrfRes.json();

            const res = await fetch('/api/auth/admin', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    [csrf.headerName]: csrf.token
                },
                body: JSON.stringify({ code })
            });

            if (res.ok) {
                location.reload();
            } else {
                errorEl.textContent = '코드가 올바르지 않습니다.';
            }
        } catch (e) {
            errorEl.textContent = '요청 중 오류가 발생했습니다.';
        }
    }
</script>

</th:block>
</body>
</html>
