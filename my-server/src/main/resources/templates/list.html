<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>JHJ's Log</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/dark-theme.css}" rel="stylesheet">
</head>
<body class="dark-theme">
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar('dashboard')}"></div>

    <div class="app-main">
        <div class="app-topbar">
            <h1>대시보드</h1>
            <div sec:authorize="isAnonymous()">
                <a href="#" onclick="openSettings(); return false;" class="btn btn-accent btn-sm">관리자 모드</a>
            </div>
            <div sec:authorize="isAuthenticated()" class="d-flex align-items-center">
                <span class="me-3" style="font-size:13px; color:var(--text-secondary);">
                    <b sec:authentication="name" style="color:var(--text-primary);"></b>님
                </span>
                <form th:action="@{/user/logout}" method="post" style="margin:0;">
                    <button type="submit" class="btn btn-outline-light btn-sm">사용자 모드로 전환</button>
                </form>
            </div>
        </div>

        <!-- 매매 통계 KPI -->
        <div class="kpi-grid" style="grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));">
            <div class="kpi-card">
                <div class="label">총 매매</div>
                <div class="value" th:text="${tradeCount}">0</div>
            </div>
            <div class="kpi-card accent-positive">
                <div class="label">승률</div>
                <div class="value positive" th:text="${winRate}">-</div>
            </div>
            <div class="kpi-card">
                <div class="label">평균 수익률</div>
                <div class="value"
                     th:text="${avgRate}"
                     th:classappend="${avgRateSign == 'positive'} ? ' positive' : ' negative'">-</div>
            </div>
            <div class="kpi-card accent-positive">
                <div class="label">최고 수익</div>
                <div class="value positive" th:text="${bestRate}">-</div>
            </div>
            <div class="kpi-card">
                <div class="label">최대 손실</div>
                <div class="value negative" th:text="${worstRate}">-</div>
            </div>
            <div class="kpi-card accent-purple">
                <div class="label">인사이트</div>
                <div class="value highlight" th:text="${insightCount}">0</div>
            </div>
        </div>

        <!-- BTC 차트 + 워치리스트 -->
        <div style="display:grid; grid-template-columns:1.7fr 1fr; gap:14px; margin-bottom:24px;">
            <div class="chart-panel">
                <div class="chart-header">
                    <div>
                        <span class="symbol">BTC / KRW</span>
                        <span id="btc-price" style="font-size:13px; color:var(--text-secondary); margin-left:10px;">로딩 중...</span>
                    </div>
                    <span id="btc-change" class="change">-</span>
                </div>
                <svg id="btc-chart-svg" viewBox="0 0 400 140" preserveAspectRatio="none"
                     style="width:100%; height:140px; display:block;">
                    <polygon id="btc-chart-fill" points="" fill="#5BD99B" opacity="0.08"/>
                    <polyline id="btc-chart-line" points=""
                              fill="none" stroke="#5BD99B" stroke-width="2"/>
                </svg>
                <div class="chart-axis-labels" id="btc-axis-labels">
                    <span>D-6</span><span>D-4</span><span>D-2</span><span>오늘</span>
                </div>
            </div>

            <div class="content-card">
                <div class="section-label">워치리스트</div>
                <div id="wl-BTC" class="watchlist-row">
                    <span class="symbol">BTC</span>
                    <span id="wl-BTC-price" style="font-size:11px; color:var(--text-secondary);">-</span>
                    <span id="wl-BTC-rate" class="change">-</span>
                </div>
                <div id="wl-ETH" class="watchlist-row">
                    <span class="symbol">ETH</span>
                    <span id="wl-ETH-price" style="font-size:11px; color:var(--text-secondary);">-</span>
                    <span id="wl-ETH-rate" class="change">-</span>
                </div>
                <div id="wl-SOL" class="watchlist-row">
                    <span class="symbol">SOL</span>
                    <span id="wl-SOL-price" style="font-size:11px; color:var(--text-secondary);">-</span>
                    <span id="wl-SOL-rate" class="change">-</span>
                </div>
                <div id="wl-XRP" class="watchlist-row">
                    <span class="symbol">XRP</span>
                    <span id="wl-XRP-price" style="font-size:11px; color:var(--text-secondary);">-</span>
                    <span id="wl-XRP-rate" class="change">-</span>
                </div>
            </div>
        </div>

        <!-- 미니 차트 그리드 -->
        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); gap:12px; margin-bottom:28px;">
            <div class="mini-chart-card" th:each="coin : ${ {'ADA','DOGE','AVAX','MATIC'} }">
                <div class="mini-chart-header">
                    <span class="symbol" th:text="${coin}">COIN</span>
                    <span class="change" th:id="'mini-' + ${coin} + '-rate'">-</span>
                </div>
                <div style="font-size:12px; color:var(--text-secondary); margin-top:4px;"
                     th:id="'mini-' + ${coin} + '-price'">-</div>
            </div>
        </div>

        <!-- 바로가기 카드 -->
        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:12px; margin-bottom:28px;">
            <div class="content-card shortcut-card" onclick="openPanel('TRADE_LOG')" style="cursor:pointer;">
                <div style="display:flex; align-items:center; gap:10px;">
                    <i class="bi bi-graph-up-arrow" style="font-size:22px; color:var(--accent-teal);"></i>
                    <div>
                        <div style="font-size:13px; font-weight:500; color:var(--text-primary);">매매일지</div>
                        <div style="font-size:11px; color:var(--text-tertiary);" th:text="${tradeCount} + '개의 기록'">0개의 기록</div>
                    </div>
                </div>
            </div>
            <div class="content-card shortcut-card" onclick="openPanel('INSIGHT')" style="cursor:pointer;">
                <div style="display:flex; align-items:center; gap:10px;">
                    <i class="bi bi-lightbulb" style="font-size:22px; color:var(--accent-pink);"></i>
                    <div>
                        <div style="font-size:13px; font-weight:500; color:var(--text-primary);">인사이트</div>
                        <div style="font-size:11px; color:var(--text-tertiary);" th:text="${insightCount} + '개의 기록'">0개의 기록</div>
                    </div>
                </div>
            </div>
            <div class="content-card shortcut-card" onclick="openPortfolioPanel()" style="cursor:pointer;">
                <div style="display:flex; align-items:center; gap:10px;">
                    <i class="bi bi-pie-chart" style="font-size:22px; color:var(--accent-purple);"></i>
                    <div>
                        <div style="font-size:13px; font-weight:500; color:var(--text-primary);">포트폴리오</div>
                        <div style="font-size:11px; color:var(--text-tertiary);">보유 현황 관리</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 최신 뉴스 미리보기 -->
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
            <div class="section-label" style="margin:0;">최신 뉴스</div>
            <button class="btn btn-sm btn-outline-secondary" onclick="openNewsPanel()"
                    style="font-size:11px; padding:3px 10px;">전체 보기</button>
        </div>
        <div id="news-preview" class="news-preview-grid">
            <div style="color:var(--text-tertiary); font-size:13px; text-align:center; padding:24px 0; grid-column:1/-1;">
                뉴스를 불러오는 중...
            </div>
        </div>
    </div>

    <!-- 푸시 패널 -->
    <div id="app-panel" class="app-panel">
        <div class="panel-inner">
            <div class="panel-header">
                <span id="panel-title" class="panel-header-title">매매일지</span>
                <button class="panel-close-btn" onclick="closePanel()" title="닫기">
                    <i class="bi bi-chevron-right"></i>
                </button>
            </div>
            <div id="panel-body" class="panel-body"></div>
        </div>
    </div>
</div>

<script th:inline="none">
// ─── 패널 공통 ───────────────────────────────────────────
var currentPanelType = null;

function openPanel(type) {
    currentPanelType = type;
    document.getElementById('panel-title').textContent = type === 'TRADE_LOG' ? '매매일지' : '인사이트';
    document.getElementById('app-panel').classList.add('open');
    loadBoard(type, 0, null);
}

function openNewsPanel() {
    currentPanelType = 'NEWS';
    document.getElementById('panel-title').textContent = '뉴스';
    document.getElementById('app-panel').classList.add('open');
    loadNews(0);
}

function closePanel() {
    document.getElementById('app-panel').classList.remove('open');
    currentPanelType = null;
}

function loadBoard(type, page, keyword) {
    var url = '/panel/board?type=' + type + '&page=' + (page || 0);
    if (keyword) url += '&keyword=' + encodeURIComponent(keyword);
    fetch(url).then(r => r.text()).then(html => {
        document.getElementById('panel-body').innerHTML = html;
    });
}

function loadPost(id) {
    fetch('/panel/post/' + id).then(r => r.text()).then(html => {
        document.getElementById('panel-body').innerHTML = html;
    });
}

function loadNews(page) {
    fetch('/panel/news?page=' + (page || 0)).then(r => r.text()).then(html => {
        document.getElementById('panel-body').innerHTML = html;
    });
}

function openPortfolioPanel() {
    currentPanelType = 'PORTFOLIO';
    document.getElementById('panel-title').textContent = '포트폴리오';
    document.getElementById('app-panel').classList.add('open');
    loadPortfolio();
}

function loadPortfolio() {
    fetch('/panel/portfolio').then(r => r.text()).then(html => {
        document.getElementById('panel-body').innerHTML = html;
    });
}

function loadNewsDetail(id) {
    document.getElementById('panel-title').textContent = '뉴스';
    document.getElementById('app-panel').classList.add('open');
    fetch('/panel/news/' + id).then(r => r.text()).then(html => {
        document.getElementById('panel-body').innerHTML = html;
    });
}

document.addEventListener('click', function(e) {
    var postCard = e.target.closest('[data-panel-post]');
    if (postCard) { e.preventDefault(); loadPost(postCard.dataset.panelPost); return; }

    var pageLink = e.target.closest('[data-panel-page]');
    if (pageLink) {
        e.preventDefault();
        var d = pageLink.dataset.panelPage.split(':');
        loadBoard(d[0], d[1], d[2] || null);
        return;
    }

    var backBtn = e.target.closest('[data-panel-back]');
    if (backBtn) { e.preventDefault(); loadBoard(backBtn.dataset.panelBack, 0, null); return; }

    var newsPage = e.target.closest('[data-panel-news]');
    if (newsPage) { e.preventDefault(); loadNews(newsPage.dataset.panelNews); return; }

    var newsCard = e.target.closest('[data-news-id]');
    if (newsCard) { e.preventDefault(); loadNewsDetail(newsCard.dataset.newsId); return; }

    var newsBack = e.target.closest('[data-panel-back-news]');
    if (newsBack) { e.preventDefault(); loadNews(0); return; }
});

// ─── 업비트 실시간 시세 ──────────────────────────────────
var WATCHLIST  = ['BTC', 'ETH', 'SOL', 'XRP'];
var MINI_COINS = ['ADA', 'DOGE', 'AVAX'];

function formatKrw(price) {
    if (price >= 100_000_000) return (price / 100_000_000).toFixed(2) + '억';
    if (price >= 10_000)      return Math.round(price / 10_000) + '만';
    return price.toLocaleString();
}

function formatRate(rate) {
    var pct = (rate * 100).toFixed(2);
    return (rate >= 0 ? '+' : '') + pct + '%';
}

function fetchTicker() {
    fetch('/api/ticker')
        .then(r => r.json())
        .then(data => {
            data.forEach(t => {
                var coin = t.market.replace('KRW-', '');
                var price = formatKrw(t.trade_price);
                var rate  = formatRate(t.signed_change_rate);
                var cls   = t.change === 'RISE' ? 'positive' : t.change === 'FALL' ? 'negative' : '';

                // 워치리스트
                if (WATCHLIST.includes(coin)) {
                    var priceEl = document.getElementById('wl-' + coin + '-price');
                    var rateEl  = document.getElementById('wl-' + coin + '-rate');
                    if (priceEl) priceEl.textContent = price;
                    if (rateEl)  { rateEl.textContent = rate; rateEl.className = 'change ' + cls; }
                }

                // BTC 헤더
                if (coin === 'BTC') {
                    var p = document.getElementById('btc-price');
                    var c = document.getElementById('btc-change');
                    if (p) p.textContent = formatKrw(t.trade_price) + '원';
                    if (c) { c.textContent = rate; c.className = 'change ' + cls; }
                }

                // 미니 카드
                if (MINI_COINS.includes(coin)) {
                    var mr = document.getElementById('mini-' + coin + '-rate');
                    var mp = document.getElementById('mini-' + coin + '-price');
                    if (mr) { mr.textContent = rate; mr.className = 'change ' + cls; }
                    if (mp) mp.textContent = price + '원';
                }
            });
        })
        .catch(() => {});
}

function fetchBtcCandles() {
    fetch('/api/candles/btc')
        .then(r => r.json())
        .then(candles => {
            // 오래된 순으로 정렬
            var prices = candles.map(c => c.trade_price).reverse();
            drawChart(prices);

            // 축 레이블 업데이트
            var labels = candles.map(c => {
                var d = new Date(c.candle_date_time_kst);
                return (d.getMonth()+1) + '/' + d.getDate();
            }).reverse();
            var axisEl = document.getElementById('btc-axis-labels');
            if (axisEl) {
                axisEl.innerHTML = [labels[0], labels[2], labels[4], labels[6]]
                    .map(l => '<span>' + l + '</span>').join('');
            }
        })
        .catch(() => {});
}

function drawChart(prices) {
    var W = 400, H = 140, PAD = 10;
    var min = Math.min(...prices);
    var max = Math.max(...prices);
    var range = max - min || 1;
    var step  = W / (prices.length - 1);

    var pts = prices.map((p, i) => {
        var x = (i * step).toFixed(1);
        var y = (H - PAD - ((p - min) / range) * (H - PAD * 2)).toFixed(1);
        return x + ',' + y;
    }).join(' ');

    var fillPts = '0,' + (H - PAD) + ' ' + pts + ' ' + W + ',' + (H - PAD);

    var line = document.getElementById('btc-chart-line');
    var fill = document.getElementById('btc-chart-fill');
    if (line) line.setAttribute('points', pts);
    if (fill) fill.setAttribute('points', fillPts);
}

// ─── 뉴스 미리보기 (대시보드 하단) ─────────────────────
function fetchNewsPreview() {
    fetch('/panel/news?page=0').then(r => r.text()).then(html => {
        var tmp = document.createElement('div');
        tmp.innerHTML = html;
        var cards = tmp.querySelectorAll('.news-card');
        var preview = document.getElementById('news-preview');
        if (!preview) return;
        if (cards.length === 0) {
            preview.innerHTML = '<div style="color:var(--text-tertiary);font-size:13px;text-align:center;padding:24px 0;grid-column:1/-1;">아직 수집된 뉴스가 없습니다.</div>';
            return;
        }
        preview.innerHTML = '';
        // 최신 4개만 미리보기
        Array.from(cards).slice(0, 4).forEach(card => preview.appendChild(card.cloneNode(true)));
    }).catch(() => {});
}

// ─── 초기화 ──────────────────────────────────────────────
fetchTicker();
fetchBtcCandles();
fetchNewsPreview();
setInterval(fetchTicker, 10_000);
setInterval(fetchBtcCandles, 60_000);
</script>
</body>
</html>
