# Server Settings (Production)
server.address=0.0.0.0
server.port=8080

# Database (Production - MySQL)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway: 스키마를 마이그레이션 스크립트로 관리 (Hibernate ddl-auto 대체)
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JPA (Production)
# Flyway가 스키마를 관리하므로 Hibernate는 엔티티-스키마 일치 여부만 검증한다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.h2.console.enabled=false

# CORS: 프론트(Cloudflare Pages)와 백엔드(Cloudflare Tunnel) origin이 분리되므로 명시적으로 허용해야 한다.
# 예: FRONTEND_ORIGIN=https://myweb.pages.dev 또는 커스텀 도메인
app.cors.allowed-origin=${FRONTEND_ORIGIN}

# 세션/CSRF 쿠키를 cross-origin(Pages -> Tunnel) 요청에도 실어 보내려면 SameSite=None이 필요하고,
# SameSite=None은 Secure 속성이 같이 있어야 브라우저가 쿠키를 받아들인다(Cloudflare Tunnel이 HTTPS를 제공하므로 충족됨).
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true

# Cloudflare Tunnel -> 로컬 Spring Boot(HTTP) 구간에서 원래 요청이 HTTPS였다는 정보(X-Forwarded-* 헤더)를
# 그대로 신뢰하도록 설정 — 이게 없으면 Spring이 요청을 HTTP로 인식해 Secure 쿠키를 아예 내려주지 않는다.
server.forward-headers-strategy=framework
