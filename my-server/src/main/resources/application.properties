# Application Name
spring.application.name=my-server

# Active Profile (Default: local)
spring.profiles.active=local

# Common Settings
spring.jackson.time-zone=Asia/Seoul

# 파일 업로드 (자격증 합격확인증 PDF 등) — 너무 큰 파일이 올라오는 걸 막기 위한 상한
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# 지식 그래프(Neo4j) — 글·코드·프로젝트·기술을 그래프로 동기화(MySQL이 원본, 그래프는 파생).
# 기본은 꺼짐. 켜려면 환경변수 GRAPH_ENABLED=true, NEO4J_PASSWORD=... (Neo4j Query API, HTTP 7474)
myweb.graph.enabled=${GRAPH_ENABLED:false}
myweb.graph.uri=${NEO4J_HTTP_URI:http://localhost:7474}
myweb.graph.database=${NEO4J_DATABASE:neo4j}
myweb.graph.username=${NEO4J_USERNAME:neo4j}
myweb.graph.password=${NEO4J_PASSWORD:}

# AI 질문(Hybrid RAG) — 키는 서버 환경변수로만. 키가 없으면 해당 기능만 꺼진다.
myweb.ai.voyage-api-key=${VOYAGE_API_KEY:}
myweb.ai.embedding-model=${EMBEDDING_MODEL:voyage-4-lite}
myweb.ai.embedding-dimensions=${EMBEDDING_DIMENSIONS:1024}
myweb.ai.anthropic-api-key=${ANTHROPIC_API_KEY:}
myweb.ai.chat-model=${CHAT_MODEL:claude-haiku-5-5}
myweb.ai.chat-max-tokens=${CHAT_MAX_TOKENS:1024}
# 기본은 관리자만. true로 바꾸면 방문자도 사용(IP당·전체 하루 한도 적용)
myweb.ai.chat-public=${CHAT_PUBLIC:false}
myweb.ai.chat-daily-limit-per-ip=${CHAT_DAILY_LIMIT_PER_IP:10}
myweb.ai.chat-daily-limit-total=${CHAT_DAILY_LIMIT_TOTAL:200}
